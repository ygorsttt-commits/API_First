name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissão mínima: o CI só lê o código
permissions:
  contents: read

# Se um novo push chegar no mesmo PR, cancela a execução antiga
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Testes (pytest)
        run: pytest -v

  contrato:
    name: Valida contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validar openapi.yaml
        run: |
          pip install openapi-spec-validator==0.7.1
          openapi-spec-validator openapi.yaml

  imagem:
    name: Build e scan da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem Docker
        run: docker build -t api-first:${{ github.sha }} .

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-first:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # só bloqueia o que já tem correção disponível
          exit-code: "1"         # falha o job se encontrar

  terraform:
    name: Terraform plan
    # A role de plan só aceita PRs deste repositório (não roda em push nem em forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necessário para o OIDC (login na AWS sem chaves)
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_allowed_cidr: ${{ vars.TF_ALLOWED_CIDR }}
      TF_VAR_image_tag: ${{ vars.TF_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TEMPORÁRIO: mostra o "sub" do token OIDC para diagnosticar a confiança da role
      - name: Debug OIDC sub
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .sub || true

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265469156400:role/api-first-github-plan
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Formatação
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -no-color -out=tfplan
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
